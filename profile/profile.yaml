# List of Jarvis projects
jarvis_projects:
  - name: Credit Risk Prediction
    git_url: "/machine_learning" 
    description: "Built a predictive credit risk modeling pipeline to identify high-risk loan applicants and reduce potential defaults using Python and Scikit-learn. Implemented automated preprocessing with feature engineering, missing-value handling, encoding, and scaling, followed by comparative evaluation of multiple classification algorithms. Optimized model performance through hyperparameter tuning, cross-validation, and imbalance handling techniques, while leveraging SHAP-based explainability to analyze feature contributions and improve model transparency."

  - name: "Cluster Monitor"
    git_url: "/linux_sql"

    description: "Automated Linux cluster analysis (LCA) and node orchestration using Bash scripting and PostgreSQL to centralize and analyze cluster resource metrics. Containerized data collection and reporting workflows with Docker and managed version control using Git to ensure reproducibility and collaborative development. Enabled scalable SQL-based reporting on node usage trends to support data-driven capacity planning and resource allocation."
  - name: "Core Java Apps"
    git_url: "/core_java"
    description:
      - "Twitter App: Placeholder to allow profile_app.sh to work."
      - "JDBC App: Placeholder to allow profile_app.sh to work."
      - "Grep App: Built a Java-based grep application to recursively scan large directory structures, apply regex-based filtering, and persist matched results to disk with efficient I/O handling. Implemented modular, interface-driven design with robust exception handling, UTF-8 encoding, and stream-based file traversal using Java NIO. Managed dependencies and project lifecycle using Maven, and integrated structured logging with SLF4J and Log4j for observability."
