highlighted_projects:
    #project name
  - name: "Databricks Bullhorn CRM Pipeline"
    description: "Maintained and enhanced enterprise ETL pipelines in Databricks using PySpark, Delta Live Tables, and Medallion Architecture (Bronze, Silver, Gold) to ingest, transform, and curate CRM data for downstream reporting and analytics. Developed REST API-based ingestion workflows using token authentication, orchestrated tier-specific pipelines through centralized Databricks Jobs, and implemented testing pipelines and validation checks to ensure data quality, code reliability, and production readiness."
  - name: "E-commerce Data Platform Architecture"
    #URL is optional
    git_url: "https://github.com/ayewhosthat/IBM-Data-Engineering-Capstone"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a hybrid on-premise/cloud data platform for an e-commerce company, integrating MySQL for OLTP and MongoDB for NoSQL storage. Built automated ETL pipelines using Python and Apache Airflow to load data into a PostgreSQL staging warehouse and Hadoop for large-scale analytics. Applied PySpark and SparkML to support big data processing and sales forecasting within the analytics pipeline. Enabled business intelligence reporting and KPI dashboards through IBM Cognos Analytics to support data-driven decision-making.

